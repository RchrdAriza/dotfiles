# background_opacity 0.8


# BEGIN_KITTY_FONTS
font_family      family="Hack Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
allow_remote_control yes


# background #2E3440
# foreground #D8DEE9
background_opacity 0.55
background_blur 0

# New tab in ~/
map ctrl+shift+t new_tab

# New tab in the current directory
map ctrl+shift+alt+t new_tab_with_cwd

# END_KITTY_FONTS
